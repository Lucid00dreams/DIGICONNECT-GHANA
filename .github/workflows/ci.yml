name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & Test Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Root Dependencies
        run: npm install --no-audit

      - name: Install Backend Dependencies
        run: npm install --prefix backend --no-audit

      - name: Install Frontend Dependencies
        run: npm install --prefix frontend --no-audit

      - name: Run Backend Automated Tests
        run: npm test

      - name: Verify Backend Production Build (tsc)
        run: npm run build:backend

      - name: Verify Frontend Production Build (next build)
        run: npm run build:frontend
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
          NEXT_PUBLIC_SITE_URL: "https://digiconnectghana.org"
