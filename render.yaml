services:
  # DigiConnect Ghana Backend REST API
  - type: web
    name: digiconnect-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CORS_ORIGIN
        value: https://digiconnect-ghana.vercel.app
      - key: ADMIN_EMAIL
        value: admin@digiconnectghana.org
      - key: ADMIN_PASSWORD
        value: DigiConnect@2026!Secure
      - key: SESSION_SECRET
        generateValue: true
      - key: API_KEY
        generateValue: true
